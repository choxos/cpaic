# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Deliberately NOT adding https://stan-dev.r-universe.dev as a repository.
      # It serves development builds of rstan and StanHeaders that outrank the
      # CRAN releases, and the Windows binary of one of those could not resolve
      # its own DLL:
      #
      #   unable to load shared object '.../rstan/libs/x64/rstan.dll':
      #   LoadLibrary failure: The specified module could not be found.
      #
      # which killed `configure.win` and with it the whole build. CRAN will
      # resolve rstan from CRAN, so the check should too. cmdstanr is the only
      # thing that actually needs the r-universe, and it is installed by name
      # below.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # cmdstanr is a Suggests and is not on CRAN, so R CMD check would report
      # it missing. Take it from source rather than from the r-universe, which
      # would bring the development Stan stack back with it.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            stan-dev/cmdstanr
          needs: check

      # A qualified package::function() reference is not inert prose: the
      # pkgdown site resolves it by LOADING that package, so naming one we do
      # not hard-depend on makes the docs build a hostage of whatever is
      # installed on the runner. That is invisible on a pull request, because
      # the pkgdown workflow runs only on the default branch, so check it here.
      - name: Documentation references only hard dependencies
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")
          hard <- trimws(sub(" .*", "", strsplit(desc[1, "Imports"], ",")[[1]]))
          # knitr/rmarkdown appear in chunk setup, remotes in an install line;
          # cmdstanr and ggplot2 are Suggests that load cleanly. The packages
          # that broke the build were those with heavy compiled objects.
          allowed <- c(hard, "knitr", "rmarkdown", "remotes", "cmdstanr",
                       "ggplot2", "base", "utils", "stats", "methods",
                       "parallel", "namespace")
          files <- c(list.files("man", "[.]Rd$", full.names = TRUE),
                     list.files("vignettes", "[.]Rmd$", full.names = TRUE),
                     "README.md", "NEWS.md", "_pkgdown.yml")
          files <- files[file.exists(files)]
          bad <- unlist(lapply(files, function(f) {
            txt <- readLines(f, warn = FALSE)
            pk <- unique(sub("::.*", "", unlist(regmatches(txt, gregexpr(
              "[A-Za-z][A-Za-z0-9.]*::[A-Za-z0-9._]+", txt)))))
            o <- setdiff(pk, allowed)
            if (length(o)) paste0("  ", f, ": ", paste(o, collapse = ", "))
          }))
          if (length(bad)) {
            stop("These files use the double-colon form for a package cpaic ",
                 "does not hard-depend on, so building the documentation site ",
                 "will try to load it:\n", paste(bad, collapse = "\n"),
                 "\nWrite \"multinma's `RE_cor()`\" instead.", call. = FALSE)
          }
          cat("Documentation references only hard dependencies.\n")

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
